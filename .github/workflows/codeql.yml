name: CodeQL

# Reviewed Fleet Build exception (Lumvale/lumvale-infra#1486).
#
# Owner: Amir Loop maintainers and Lumvale security.
# Trigger: every push to main, a weekly backstop, and break-glass manual dispatch. Never a PR.
# Credential boundary: SARIF upload requires this repository's security-events:write token.
# Runner boundary: Amir Loop is public, while the private fleet runner group deliberately sets
# allows_public_repositories=false so untrusted public code can never reach fleet infrastructure.
# Why it stays here: Fleet Build can inspect the source, but it cannot safely supply this
# repository-scoped upload credential or admit this public repository to the private runner.
# GitHub-hosted execution is therefore the minimum suitable executor for this security control.

on:
  push:
    branches: [main]
  schedule:
    - cron: "47 4 * * 1"
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      security-events: write
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        language: [actions, python]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Initialize CodeQL
        uses: github/codeql-action/init@a35ac6e6798d72df5475948b28efb89edc2e19ca # v4.37.9
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-and-quality
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@a35ac6e6798d72df5475948b28efb89edc2e19ca # v4.37.9
        with:
          category: "/language:${{ matrix.language }}"
