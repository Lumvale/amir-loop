name: LumvaleOS playbook events
on:
  pull_request:
    types: [opened, reopened, closed]
  deployment_status:
  issues:
    types: [opened]
permissions:
  contents: read
jobs:
  emit:
    if: >-
      (github.event_name == 'pull_request' && (github.event.action == 'opened' || github.event.action == 'reopened' || github.event.pull_request.merged == true)) ||
      (github.event_name == 'deployment_status' && github.event.deployment_status.state == 'success') ||
      (github.event_name == 'issues' && contains(github.event.issue.labels.*.name, 'incident'))
    # The fleet runs on self-hosted AWS spot runners; GitHub-hosted minutes are budget-gated,
    # so a hardcoded `ubuntu-latest` is refused by the org spending limit and then reported as
    # a BUDGET problem rather than the config problem it is. This job was written that way and
    # failed on every PR while every other workflow in the fleet ran fine.
    #
    # Bare, with no `|| 'ubuntu-latest'` fallback, matching the rest of the fleet: an empty
    # variable must fail loudly as configuration, not silently move onto billable minutes.
    runs-on: ${{ vars.RUNNER_LABEL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: classify
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == pull_request && "${{ github.event.action }}" != closed ]]; then echo 'type=pr.opened' >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.event_name }}" == pull_request ]]; then echo 'type=pr.merged' >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.event_name }}" == deployment_status ]]; then echo 'type=deployment.completed' >> "$GITHUB_OUTPUT"
          else echo 'type=incident.opened' >> "$GITHUB_OUTPUT"; fi
      - uses: ./.github/actions/emit-lumvaleos-event
        with:
          event_type: ${{ steps.classify.outputs.type }}
          ingress_url: ${{ secrets.LUMVALEOS_EVENT_INGRESS_URL }}
          ingress_token: ${{ secrets.LUMVALEOS_EVENT_INGRESS_TOKEN }}
          workspace_id: ${{ secrets.LUMVALEOS_WORKSPACE_ID }}
