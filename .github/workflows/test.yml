name: tests
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bats:
    strategy:
      fail-fast: false
      matrix:
        # Linux is now covered inside Fleet Build. These are retained because a Linux runner cannot
        # execute the shipped Windows and macOS binaries or prove the plugin works in those shells.
        # macos-13 (the last Intel GitHub-hosted image) was here to exercise jq-macos-amd64,
        # which arm64 macos-latest never selects. It stopped being allocated: measured
        # 2026-09-01, EVERY macos-13 job in recent history sat `queued` and none ever started,
        # so the leg contributed ZERO coverage while blocking every merge behind an admin
        # override - which bypasses the checks that do work.
        #
        # The amd64 binary is now checked on macos-latest by the step below instead: its
        # architecture is asserted from the Mach-O header, and it is executed for real whenever
        # Rosetta is present. A check that runs is worth more than a leg that cannot.
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 2
      - name: Install bats
        run: |
          git clone --depth 1 https://github.com/bats-core/bats-core /tmp/bats
          echo "/tmp/bats/bin" >> "$GITHUB_PATH"
      - name: Assert vendored jq executes on this platform
        run: |
          vendor="plugins/amir-loop/vendor/jq"
          case "$(uname -s 2>/dev/null)" in
            Linux)   bin="$vendor/jq-linux-amd64" ;;
            Darwin)  case "$(uname -m 2>/dev/null)" in
                       arm64) bin="$vendor/jq-macos-arm64" ;;
                       *)     bin="$vendor/jq-macos-amd64" ;;
                     esac ;;
            MINGW*|MSYS*|CYGWIN*) bin="$vendor/jq-windows-amd64.exe" ;;
            *) echo "FAIL: unrecognized platform $(uname -s 2>/dev/null)"; exit 1 ;;
          esac
          out="$("$bin" --version 2>&1)" || {
            echo "FAIL on platform $(uname -s 2>/dev/null) ($(uname -m 2>/dev/null)): vendored jq at $bin failed to execute: $out"
            exit 1
          }
          case "$out" in
            *jq-1.8.1*) echo "OK: $bin reports $out on $(uname -s 2>/dev/null) ($(uname -m 2>/dev/null))" ;;
            *) echo "FAIL on platform $(uname -s 2>/dev/null) ($(uname -m 2>/dev/null)): expected jq-1.8.1, got: $out"; exit 1 ;;
          esac
      # The amd64 macOS binary ships to Intel users but no runner here selects it, so assert it
      # directly rather than leaving it unverified. `file` proves the SHIPPED bytes are a real
      # x86_64 Mach-O - catching a truncated, empty, wrong-arch or LFS-pointer file, which is what
      # actually goes wrong with a vendored binary. Execution is attempted too when Rosetta is
      # installed; when it is not, that is reported and skipped rather than failing, because
      # Rosetta's absence is a fact about the runner, not about the binary.
      - name: Assert the Intel macOS jq binary is shipped correctly
        if: runner.os == 'macOS'
        run: |
          bin="plugins/amir-loop/vendor/jq/jq-macos-amd64"
          test -s "$bin" || { echo "FAIL: $bin is missing or empty"; exit 1; }
          described="$(file -b "$bin")"
          case "$described" in
            *x86_64*) echo "OK: $bin is $described" ;;
            *) echo "FAIL: $bin is not an x86_64 binary: $described"; exit 1 ;;
          esac
          if /usr/bin/arch -x86_64 /usr/bin/true 2>/dev/null; then
            out="$(/usr/bin/arch -x86_64 "$bin" --version 2>&1)" || {
              echo "FAIL: $bin did not execute under Rosetta: $out"; exit 1; }
            case "$out" in
              *jq-1.8.1*) echo "OK: $bin reports $out under Rosetta" ;;
              *) echo "FAIL: expected jq-1.8.1 under Rosetta, got: $out"; exit 1 ;;
            esac
          else
            echo "SKIP: Rosetta is not installed on this runner; architecture asserted only"
          fi
      - run: bats tests/
